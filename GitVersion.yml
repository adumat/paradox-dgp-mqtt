mode: ContinuousDeployment
next-version: 0.1.0
branches:
  main:
    regex: ^master$|^main$
    mode: ContinuousDeployment
    label: ci
    increment: Patch
  feature:
    regex: ^features?[/-]
    mode: ContinuousDeployment
    label: alpha
    increment: Minor
  fix:
    regex: ^(bug)?fix(es)?[/-]
    mode: ContinuousDeployment
    label: beta
    increment: Patch
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDeployment
    label: pr
    increment: Inherit
