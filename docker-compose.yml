services:
  digiplex:
    image: ghcr.io/adumat/paradox-dgp-mqtt:${IMAGE_TAG:-latest}
    container_name: digiplex
    restart: unless-stopped
    devices:
      - ${SERIAL_DEVICE:-/dev/ttyUSB0}:${SERIAL_DEVICE:-/dev/ttyUSB0}
    environment:
      - Serilog__MinimumLevel__Default=${LOG_MIN_LEVEL:-Information}
      - Serial__PortName=${SERIAL_DEVICE:-/dev/ttyUSB0}
      - Serial__Password=${SERIAL_PASSWORD:-1234}
      - Serial__BaudRate=${SERIAL_BAUD_RATE:-19200}
      - Serial__PollIntervalMs=${SERIAL_POLL_INTERVAL_MS:-1000}
      - Serial__UseMock=${USE_MOCK:-false}
      - Mqtt__BrokerHost=${MQTT_BROKER_HOST:-mosquitto}
      - Mqtt__BrokerPort=${MQTT_BROKER_PORT:-1883}
      - Mqtt__Username=${MQTT_USERNAME:-}
      - Mqtt__Password=${MQTT_PASSWORD:-}
      - Mqtt__TopicPrefix=${MQTT_TOPIC_PREFIX:-digiplex}
      - Mqtt__EnableHomeAssistantDiscovery=${MQTT_HA_DISCOVERY:-true}
      #- Mqtt__AlarmCode=1234  # Optional: require PIN in HA to arm/disarm
      # Partition items (DeviceClass = HA binary_sensor class for zones in this partition)
      - Partitions__Items__0__Id=1
      - Partitions__Items__0__Label=Contatti Piano Terra
      - Partitions__Items__0__DeviceClass=opening
      - Partitions__Items__0__ZoneIds__0=1
      - Partitions__Items__0__ZoneIds__1=2
      - Partitions__Items__0__ZoneIds__2=3
      - Partitions__Items__0__ZoneIds__3=4
      - Partitions__Items__0__ZoneIds__4=5
      - Partitions__Items__0__ZoneIds__5=6
      - Partitions__Items__1__Id=2
      - Partitions__Items__1__Label=Contatti Primo Piano
      - Partitions__Items__1__DeviceClass=opening
      - Partitions__Items__1__ZoneIds__0=7
      - Partitions__Items__1__ZoneIds__1=8
      - Partitions__Items__1__ZoneIds__2=9
      - Partitions__Items__1__ZoneIds__3=10
      - Partitions__Items__1__ZoneIds__4=11
      - Partitions__Items__1__ZoneIds__5=12
      - Partitions__Items__2__Id=3
      - Partitions__Items__2__Label=Radar Piano Terra
      - Partitions__Items__2__DeviceClass=motion
      - Partitions__Items__2__ZoneIds__0=13
      - Partitions__Items__2__ZoneIds__1=14
      - Partitions__Items__2__ZoneIds__2=15
      - Partitions__Items__2__ZoneIds__3=16
      - Partitions__Items__3__Id=4
      - Partitions__Items__3__Label=Radar Primo Piano
      - Partitions__Items__3__DeviceClass=motion
      - Partitions__Items__3__ZoneIds__0=17
      - Partitions__Items__3__ZoneIds__1=18
      - Partitions__Items__3__ZoneIds__2=19
      - Partitions__Items__3__ZoneIds__3=20
      # Per-zone device_class overrides (takes precedence over partition default)
      #- Partitions__ZoneOverrides__0__Id=3
      #- Partitions__ZoneOverrides__0__DeviceClass=door
      # Partition groups
      - Partitions__Groups__0__Id=contatti
      - Partitions__Groups__0__Label=Contatti
      - Partitions__Groups__0__PartitionIds__0=1
      - Partitions__Groups__0__PartitionIds__1=2
      - Partitions__Groups__1__Id=radar
      - Partitions__Groups__1__Label=Radar
      - Partitions__Groups__1__PartitionIds__0=3
      - Partitions__Groups__1__PartitionIds__1=4
      - Partitions__Groups__2__Id=piano_terra
      - Partitions__Groups__2__Label=Piano Terra
      - Partitions__Groups__2__PartitionIds__0=1
      - Partitions__Groups__2__PartitionIds__1=3
      - Partitions__Groups__3__Id=primo_piano
      - Partitions__Groups__3__Label=Primo Piano
      - Partitions__Groups__3__PartitionIds__0=2
      - Partitions__Groups__3__PartitionIds__1=4
    dns:
      - 192.168.1.3
    dns_search: lan

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    profiles:
      - mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log:
